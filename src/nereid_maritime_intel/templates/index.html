<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEREID — Maritime Intelligence & AIS Vessel Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #05131d;
            --card-bg: rgba(10, 30, 48, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #0284c7;
            --text-color: #f0f9ff;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 50% 100%, rgba(2, 132, 199, 0.12) 0%, transparent 50%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .logo-title { font-size: 1.3rem; font-weight: 700; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }

        .map-wrapper {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            min-height: 550px;
        }

        #map { width: 100%; height: 100%; min-height: 550px; }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(2, 132, 199, 0.15);
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🚢</div>
            <div>
                <div class="logo-title">NEREID</div>
                <div class="logo-subtitle">Suivi Maritime & Tracking AIS Live</div>
            </div>
        </div>
        <div class="badge" id="vesselBadge">RÉSEAU AIS MARITIME ACTIF</div>
    </header>

    <div class="map-wrapper">
        <div id="map"></div>
    </div>

    <script>
        let map = L.map('map').setView([49.49, 0.10], 9);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: 'OpenStreetMap, AIS Marine'
        }).addTo(map);

        async function chargerNavires() {
            try {
                const response = await fetch('/api/v1/vessels');
                const contract = await response.json();
                const vessels = contract.result.vessels || [];

                document.getElementById('vesselBadge').textContent = `${vessels.length} NAVIRES AIS EN DIRECT`;

                vessels.forEach(v => {
                    const marker = L.circleMarker([v.lat, v.lon], {
                        radius: 9,
                        fillColor: '#38bdf8',
                        color: '#0284c7',
                        weight: 2,
                        fillOpacity: 0.9
                    }).addTo(map);

                    marker.bindPopup(`
                        <div style="font-family:Inter; color:#1e293b;">
                            <strong style="font-size:1.05rem; color:#0284c7;">🚢 ${v.name}</strong><br/>
                            <span>Type: ${v.vessel_type}</span><br/>
                            <span>Pavillon: ${v.flag}</span><br/>
                            <span>Destination: ${v.destination}</span><br/>
                            <span>Vitesse: ${v.speed_knots} nœuds</span><br/>
                            <span style="font-size:0.75rem; color:#64748b;">MMSI: ${v.mmsi}</span>
                        </div>
                    `);
                });

            } catch (err) {
                console.error("Erreur lors de la récupération des navires AIS.");
            }
        }

        window.onload = chargerNavires;
    </script>
</body>
</html>
